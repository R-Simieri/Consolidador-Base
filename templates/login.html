<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · Capital Control</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #0c1b33;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .login-container h1 {
            font-size: 24px;
            font-weight: 800;
            color: #0c1b33;
            margin-bottom: 8px;
        }
        .login-container h1 span { color: #2d6fb0; }
        .login-container p { color: #6c757d; font-size: 14px; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-weight: 600; font-size: 13px; color: #495057; margin-bottom: 4px; }
        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #dce1e8;
            border-radius: 8px;
            font-size: 14px;
        }
        .form-group input:focus { outline: none; border-color: #2d6fb0; }
        .btn {
            width: 100%;
            padding: 12px;
            background: #2d6fb0;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn:hover { background: #1a4f80; }
        .erro { color: #dc3545; font-size: 13px; margin-bottom: 12px; padding: 8px 12px; background: #f8d7da; border-radius: 6px; }
        .cadastro-link { text-align: center; margin-top: 16px; font-size: 14px; color: #6c757d; }
        .cadastro-link a { color: #2d6fb0; font-weight: 600; text-decoration: none; }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>CAPITAL<span>CONTROL</span></h1>
        <p>Faça login para acessar seu painel</p>
        
        {% if erro %}
        <div class="erro">{{ erro }}</div>
        {% endif %}
        
        <form method="post">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required placeholder="seu@email.com">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" name="senha" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn">Entrar</button>
        </form>
        
        <div class="cadastro-link">
            Não tem uma conta? <a href="/cadastro">Cadastre-se</a>
        </div>
    </div>
</body>
</html>
